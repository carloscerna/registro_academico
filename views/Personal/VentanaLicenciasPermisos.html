<!-- VENTANA MODAL PARA EDITAR LICENCIAS / PERMISOS -->
<div class="modal fade" id="VentanaLicenciasPermisos" tabindex="-1" role="dialog" aria-labelledby="modalLicenciasTitle" aria-hidden="true" data-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content shadow-lg border-0">
      
      <!-- Encabezado Modal -->
      <div class="modal-header bg-navy text-white py-2">
        <h5 class="modal-title font-weight-bold" id="modalLicenciasTitle">
          <i class="fas fa-edit mr-2"></i>Editar Licencia / Permiso
        </h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <!-- Formulario Modal -->
      <form id="formVentanaLicenciasPermisos" name="formVentanaLicenciasPermisos" method="post">
        <input type="hidden" id="accion_licencias_permisos" name="accion_licencias_permisos" value="ActualizarLyP">
        <input type="hidden" id="id_licencia_permiso_modal" name="id_licencia_permiso_modal">

        <div class="modal-body p-4">
          <div class="row">
            <!-- ID del Registro -->
            <div class="col-md-4 col-12 mb-3">
              <label for="IdHorarios" class="font-weight-bold">ID Registro</label>
              <input type="text" class="form-control bg-light" id="IdHorarios" name="IdHorarios" readonly>
            </div>

            <!-- Fecha del Permiso -->
            <div class="col-md-8 col-12 mb-3">
              <label for="FechaInicio" class="font-weight-bold">Fecha del Permiso</label>
              <input type="date" class="form-control" id="FechaInicio" name="FechaInicio">
            </div>
          </div>

          <div class="row">
            <!-- Rango Horario -->
            <div class="col-md-6 col-12 mb-3">
              <label for="ModalHoraDesde" class="font-weight-bold">Hora Inicio</label>
              <input type="time" class="form-control" id="ModalHoraDesde" name="ModalHoraDesde">
            </div>

            <div class="col-md-6 col-12 mb-3">
              <label for="ModalHoraHasta" class="font-weight-bold">Hora Fin</label>
              <input type="time" class="form-control" id="ModalHoraHasta" name="ModalHoraHasta">
            </div>
          </div>

          <div class="row">
            <!-- Días / Horas / Minutos -->
            <div class="col-md-4 col-12 mb-3">
              <label for="ModalDia" class="font-weight-bold">Días</label>
              <input type="number" class="form-control" id="ModalDia" name="ModalDia" min="0">
            </div>
            <div class="col-md-4 col-12 mb-3">
              <label for="ModalHora" class="font-weight-bold">Horas</label>
              <input type="number" class="form-control" id="ModalHora" name="ModalHora" min="0">
            </div>
            <div class="col-md-4 col-12 mb-3">
              <label for="ModalMinutos" class="font-weight-bold">Minutos</label>
              <input type="number" class="form-control" id="ModalMinutos" name="ModalMinutos" min="0">
            </div>
          </div>

          <!-- Observaciones -->
          <div class="form-group mb-0">
            <label for="ModalObservacion" class="font-weight-bold">Observación / Motivo</label>
            <textarea class="form-control" id="ModalObservacion" name="ModalObservacion" rows="3"></textarea>
          </div>
        </div>

        <!-- Pie de Página del Modal -->
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">
            <i class="fas fa-times mr-1"></i> Cancelar
          </button>
          <button type="button" id="goGuardarModal" class="btn btn-primary">
            <i class="fas fa-save mr-1"></i> Actualizar Cambios
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
