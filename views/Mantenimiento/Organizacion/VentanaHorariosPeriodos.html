<!-- VENTANA MODAL - HORARIOS Y PERÍODOS -->
<div class="modal fade" id="VentanaHorariosPeriodos" tabindex="-1" aria-labelledby="modalHorariosLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-md modal-dialog-centered">
    <div class="modal-content shadow-lg">
      
      <!-- HEADER -->
      <div class="modal-header bg-gradient-navy text-white py-2 px-3 align-items-center">
        <h6 class="modal-title mb-0 d-flex align-items-center gap-2" id="modalHorariosLabel">
          <i class="fad fa-layer-group"></i>
          <span>Horarios | Asignación</span>
        </h6>
        <!-- Botón de cierre nativo BS5 -->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <!-- FORMULARIO -->
      <form action="" method="post" name="formVentanaHorarios" id="formVentanaHorarios" enctype="multipart/form-data">
        <input type="hidden" id="accion_horarios" name="accion_horarios" value="GuardarHorarios">

        <div class="modal-body p-3">
          
          <!-- FIELDSET 1: ORGANIZACIÓN -->
          <fieldset class="border rounded-2 p-2 mb-3">
            <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-0">Organización y Asignación</legend>
            <div class="row g-2">
              <div class="col-12">
                <div class="input-group input-group-sm mb-2">
                  <span class="input-group-text text-info fw-semibold">Año lectivo</span>
                  <span class="form-control bg-light" id="TextoAnnLectivoHorarios">---</span>
                </div>
                <div class="input-group input-group-sm">
                  <span class="input-group-text text-info fw-semibold">Modalidad</span>
                  <span class="form-control bg-light" id="TextoModalidadesHorarios">---</span>
                </div>
              </div>
            </div>
          </fieldset>

          <!-- FIELDSET 2: INFORMACIÓN GENERAL -->
          <fieldset class="border rounded-2 p-2">
            <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-0">Información General</legend>
            <div class="row g-2">
              
              <div class="col-12 col-md-6">
                <label for="lstHorarios" class="form-label small fw-semibold mb-1">Estatus</label>
                <select class="form-select form-select-sm" name="lstHorarios" id="lstHorarios"></select>
              </div>

              <div class="col-12 col-md-6">
                <label for="lstPeriodosHorarios" class="form-label small fw-semibold mb-1">Períodos</label>
                <select class="form-select form-select-sm" name="lstPeriodosHorarios" id="lstPeriodosHorarios"></select>
              </div>

              <div class="col-12">
                <div class="input-group input-group-sm my-1">
                  <span class="input-group-text bg-gradient-gray-blue text-white">ID</span>
                  <input type="text" class="form-control fw-bold" id="IdHorarios" name="IdHorarios" readonly>
                </div>
              </div>

              <div class="col-12">
                <div class="input-group input-group-sm mb-1">
                  <span class="input-group-text bg-gradient-gray-dark text-white">Fecha Inicio</span>
                  <input type="date" min="1900-01-01" max="9999-12-31" class="form-control" id="FechaInicio" name="FechaInicio" autocomplete="off">
                </div>
              </div>

              <div class="col-12">
                <div class="input-group input-group-sm mb-1">
                  <span class="input-group-text bg-gradient-gray-dark text-white">Fecha Fin</span>
                  <input type="date" min="1900-01-01" max="9999-12-31" class="form-control" id="FechaFin" name="FechaFin" autocomplete="off">
                </div>
              </div>

              <div class="col-12">
                <div class="input-group input-group-sm mb-1">
                  <span class="input-group-text bg-gradient-gray-dark text-white">Registro Académico</span>
                  <input type="date" min="1900-01-01" max="9999-12-31" class="form-control" id="FechaRA" name="FechaRA" autocomplete="off">
                </div>
              </div>

            </div>
          </fieldset>

        </div> <!-- /.modal-body -->

        <!-- FOOTER -->
        <div class="modal-footer bg-light py-2 px-3 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i> Cerrar
          </button>
          <button type="submit" class="btn btn-sm btn-primary" id="goGuardarHorarios">
            <i class="fas fa-save me-1"></i> Guardar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
