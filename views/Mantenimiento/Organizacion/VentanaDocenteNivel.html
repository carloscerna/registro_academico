<!-- VENTANA MODAL - DOCENTE / NIVEL -->
<div class="modal fade" id="VentanaDN" tabindex="-1" aria-labelledby="modalDNLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-md modal-dialog-centered">
    <div class="modal-content shadow-lg">
      
      <!-- HEADER -->
      <div class="modal-header bg-gradient-navy text-white py-2 px-3 align-items-center">
        <h6 class="modal-title mb-0 d-flex align-items-center gap-2" id="modalDNLabel">
          <i class="fad fa-layer-group"></i>
          <span>Docente / Nivel</span>
        </h6>
        <!-- Botón de cierre nativo BS5 -->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar" id="VentanaDN1"></button>
      </div>

      <!-- FORMULARIO PRINCIPAL -->
      <form action="" method="post" name="formVentanaDN" id="formVentanaDN" enctype="multipart/form-data">
        <!-- HIDDEN INPUT -->
        <input type="hidden" id="accion_dn" name="accion_dn" value="GuardarDN">

        <!-- MODAL BODY -->
        <div class="modal-body p-3">
          
<!-- FIELDSET 1: ORGANIZACIÓN Y ASIGNACIÓN -->
<fieldset class="border rounded-2 p-2 mb-3" id="FieldsetBusquedaTiquete">
  <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-0">Docente/Nivel | Organización y Asignación</legend>
  <div class="row g-2 mt-1">
    <div class="col-12">
      <div class="input-group input-group-sm mb-2">
        <span class="input-group-text text-info fw-semibold" id="TextoAnnLectivoDN">Año lectivo</span>
        <!-- Agregado id="valAnnLectivoDN" -->
        <span class="form-control bg-light" id="valAnnLectivoDN">---</span>
      </div>
      <div class="input-group input-group-sm">
        <span class="input-group-text text-info fw-semibold" id="TextoModalidadesDN">Modalidad</span>
        <!-- Agregado id="valModalidadDN" -->
        <span class="form-control bg-light" id="valModalidadDN">---</span>
      </div>
    </div>
  </div>
</fieldset>

          <!-- FIELDSET 2: INFORMACIÓN GENERAL -->
          <fieldset class="border rounded-2 p-2" id="FieldsetProduccion">
            <legend class="float-none w-auto px-2 fs-6 fw-bold text-primary mb-0">Docente/Nivel | Información General</legend>
            <div class="row g-2 mt-1">
              
              <div class="col-12 mb-2">
                <label for="lstDocenteNivel" class="form-label small fw-semibold mb-1">Nombre del Docente</label>
                <select class="form-select form-select-sm select2" name="lstDocenteNivel" id="lstDocenteNivel" style="width: 100%;"></select>
              </div>

              <div class="col-12">
                <label for="lstTurnoDN" class="form-label small fw-semibold mb-1">Turno</label>
                <select class="form-select form-select-sm" name="lstTurnoDN" id="lstTurnoDN"></select>
              </div>

            </div>
          </fieldset>

        </div> <!-- /.modal-body -->

        <!-- FOOTER MODAL -->
        <div class="modal-footer bg-light py-2 px-3 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i> Cerrar
          </button>
          <button type="button" class="btn btn-sm btn-primary" name="goActualizarDN" id="goActualizarDN">
            <i class="fas fa-save me-1"></i> Guardar
          </button>
        </div>

      </form> <!-- /form principal -->
    </div>
  </div>
</div>
